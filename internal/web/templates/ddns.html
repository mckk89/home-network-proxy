<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭网络反代 - DDNS 设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #fff; border-right: 1px solid #e9ecef; height: 100vh; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #e9ecef; }
        .sidebar-header h2 { color: #333; font-size: 18px; font-weight: 600; }
        .sidebar-nav { padding: 16px 0; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { padding: 0 20px 8px; font-size: 11px; text-transform: uppercase; color: #999; font-weight: 600; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; padding: 12px 20px; color: #555; text-decoration: none; font-size: 14px; transition: background 0.2s, color 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: #f8f9fa; color: #667eea; }
        .nav-item.active { background: #f0f2ff; color: #667eea; border-left-color: #667eea; font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; }
        .main-content { flex: 1; margin-left: 240px; padding: 32px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-header h1 { font-size: 28px; font-weight: 600; color: #333; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e9ecef; margin-bottom: 24px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 16px; font-weight: 600; color: #333; }
        .card-body { padding: 24px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .form-group small { display: block; margin-top: 6px; color: #999; font-size: 12px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #667eea; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #e9ecef; color: #333; }
        .btn-secondary:hover { background: #dee2e6; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .alert { padding: 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
        .alert.error { background: #fdeaea; color: #c62828; border: 1px solid #f5c6cb; display: block; }
        .provider-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; padding: 12px; background: #f8f9fa; border-radius: 8px; }
        .provider-row input { flex: 1; }
        .provider-row select { width: 200px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e9ecef; }
        th { background: #f8f9fa; font-weight: 600; color: #555; font-size: 13px; }
        tr:hover td { background: #f8f9fa; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .badge.success { background: #e8f5e9; color: #4caf50; }
        .badge.warning { background: #fff3e0; color: #ff9800; }
        .badge.danger { background: #fdeaea; color: #e74c3c; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); transition: transform 0.3s; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🍀 家庭网络反代 v3.5.0</h2></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">概览</div><a href="/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>仪表盘</a></div>
                <div class="nav-section"><div class="nav-section-title">网络服务</div><a href="/ddns" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>动态域名 (DDNS)</a><a href="/reverse-proxy" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>反向代理</a><a href="/socket-proxy" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/><path d="M12 6v6l4 2"/></svg>端口转发</a></div>
                <div class="nav-section"><div class="nav-section-title">系统管理</div><a href="/settings" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>系统设置</a><a href="/modules" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>模块管理</a></div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-header"><h1>动态域名 (DDNS)</h1></header>

            <div id="alert" class="alert"></div>

            <!-- 基本设置 -->
            <div class="card">
                <div class="card-header"><h3>⚙️ 基本设置</h3></div>
                <div class="card-body">
                    <form id="basicForm">
                        <div class="form-grid">
                            <div class="form-group checkbox-group">
                                <input type="checkbox" name="enabled" id="ddns_enabled" {{if .cfg.DDNS.Enabled}}checked{{end}}>
                                <label for="ddns_enabled">启用 DDNS</label>
                            </div>
                            <div class="form-group">
                                <label>更新间隔 (秒)</label>
                                <input type="number" name="interval" value="{{.cfg.DDNS.Interval}}" min="60" max="86400">
                                <small>建议 300-600 秒，过于频繁可能被服务商限制</small>
                            </div>
                            <div class="form-group checkbox-group">
                                <input type="checkbox" name="ipv4_enabled" id="ipv4_enabled" {{if .cfg.DDNS.IPv4Enabled}}checked{{end}}>
                                <label for="ipv4_enabled">启用 IPv4 更新</label>
                            </div>
                            <div class="form-group checkbox-group">
                                <input type="checkbox" name="ipv6_enabled" id="ipv6_enabled" {{if .cfg.DDNS.IPv6Enabled}}checked{{end}}>
                                <label for="ipv6_enabled">启用 IPv6 更新</label>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary">保存基本设置</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 服务商配置 -->
            <div class="card">
                <div class="card-header">
                    <h3>🌐 服务商配置</h3>
                    <button type="button" class="btn btn-secondary" onclick="addProviderRow()">+ 添加域名</button>
                </div>
                <div class="card-body">
                    <div id="providersContainer">
                        {{range $domain, $provider := .cfg.DDNS.Providers}}
                        <div class="provider-row">
                            <input type="text" name="domain" placeholder="域名 (例: example.com)" value="{{$domain}}" required>
                            <select name="provider">
                                <option value="alidns" {{if eq $provider "alidns"}}selected{{end}}>阿里云 DNS</option>
                                <option value="dnspod" {{if eq $provider "dnspod"}}selected{{end}}>DNSPod</option>
                                <option value="cloudflare" {{if eq $provider "cloudflare"}}selected{{end}}>Cloudflare</option>
                                <option value="callback" {{if eq $provider "callback"}}selected{{end}}>自定义回调</option>
                                <option value="he" {{if eq $provider "he"}}selected{{end}}>Hurricane Electric</option>
                                <option value="noip" {{if eq $provider "noip"}}selected{{end}}>No-IP</option>
                                <option value="duckdns" {{if eq $provider "duckdns"}}selected{{end}}>DuckDNS</option>
                                <option value="godaddy" {{if eq $provider "godaddy"}}selected{{end}}>GoDaddy</option>
                                <option value="namecheap" {{if eq $provider "namecheap"}}selected{{end}}>Namecheap</option>
                            </select>
                            <button type="button" class="btn btn-danger" onclick="removeProviderRow(this)">删除</button>
                        </div>
                        {{end}}
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-primary" onclick="saveProviders()">保存服务商配置</button>
                        <button type="button" class="btn btn-secondary" onclick="testDDNS()">测试更新</button>
                    </div>
                </div>
            </div>

            <!-- 服务商详细配置 -->
            <div class="card">
                <div class="card-header"><h3>🔑 服务商认证配置</h3></div>
                <div class="card-body">
                    <p style="color:#666;margin-bottom:20px;">请为每个服务商配置 API 密钥等认证信息。配置保存在系统安全存储中，不显示在配置文件中。</p>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>阿里云 AccessKey ID</label>
                            <input type="text" name="alidns_access_key" placeholder="LTAI...">
                        </div>
                        <div class="form-group">
                            <label>阿里云 AccessKey Secret</label>
                            <input type="password" name="alidns_secret" placeholder="********">
                        </div>
                        <div class="form-group">
                            <label>DNSPod Token</label>
                            <input type="text" name="dnspod_token" placeholder="12345,abcdef...">
                        </div>
                        <div class="form-group">
                            <label>Cloudflare API Token</label>
                            <input type="password" name="cloudflare_token" placeholder="********">
                        </div>
                        <div class="form-group">
                            <label>Cloudflare Zone ID</label>
                            <input type="text" name="cloudflare_zone" placeholder="可选，留空自动获取">
                        </div>
                        <div class="form-group">
                            <label>回调 URL</label>
                            <input type="text" name="callback_url" placeholder="https://api.example.com/update?domain={domain}&ip={ip}">
                        </div>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-primary" onclick="saveProviderAuth()">保存认证配置</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert ' + type;
        }

        // 基本设置表单
        document.getElementById('basicForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(this));
            data.enabled = document.getElementById('ddns_enabled').checked;
            data.ipv4_enabled = document.getElementById('ipv4_enabled').checked;
            data.ipv6_enabled = document.getElementById('ipv6_enabled').checked;

            try {
                const res = await fetch('/api/ddns', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                showAlert(result.message || '保存成功', 'success');
            } catch (err) {
                showAlert('保存失败: ' + err.message, 'error');
            }
        });

        // 添加服务商行
        function addProviderRow(domain = '', provider = 'alidns') {
            const container = document.getElementById('providersContainer');
            const div = document.createElement('div');
            div.className = 'provider-row';
            div.innerHTML = `
                <input type="text" name="domain" placeholder="域名 (例: example.com)" value="${domain}" required>
                <select name="provider">
                    <option value="alidns" ${provider==='alidns'?'selected':''}>阿里云 DNS</option>
                    <option value="dnspod" ${provider==='dnspod'?'selected':''}>DNSPod</option>
                    <option value="cloudflare" ${provider==='cloudflare'?'selected':''}>Cloudflare</option>
                    <option value="callback" ${provider==='callback'?'selected':''}>自定义回调</option>
                    <option value="he" ${provider==='he'?'selected':''}>Hurricane Electric</option>
                    <option value="noip" ${provider==='noip'?'selected':''}>No-IP</option>
                    <option value="duckdns" ${provider==='duckdns'?'selected':''}>DuckDNS</option>
                    <option value="godaddy" ${provider==='godaddy'?'selected':''}>GoDaddy</option>
                    <option value="namecheap" ${provider==='namecheap'?'selected':''}>Namecheap</option>
                </select>
                <button type="button" class="btn btn-danger" onclick="removeProviderRow(this)">删除</button>
            `;
            container.appendChild(div);
        }

        function removeProviderRow(btn) {
            btn.parentElement.remove();
        }

        // 保存服务商配置
        async function saveProviders() {
            const rows = document.querySelectorAll('#providersContainer .provider-row');
            const providers = {};
            rows.forEach(row => {
                const domain = row.querySelector('[name="domain"]').value.trim();
                const provider = row.querySelector('[name="provider"]').value;
                if (domain) providers[domain] = provider;
            });

            try {
                const res = await fetch('/api/ddns', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({providers})
                });
                const result = await res.json();
                showAlert(result.message || '保存成功', 'success');
            } catch (err) {
                showAlert('保存失败: ' + err.message, 'error');
            }
        }

        // 保存认证配置
        async function saveProviderAuth() {
            // 实际实现需要调用 API 保存敏感信息
            showAlert('认证配置保存功能开发中', 'success');
        }

        // 测试 DDNS
        async function testDDNS() {
            showAlert('测试功能开发中', 'success');
        }
    </script>
</body>
</html>
