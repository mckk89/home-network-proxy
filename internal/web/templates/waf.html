<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭网络反代 - WAF 防火墙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #fff; border-right: 1px solid #e9ecef; height: 100vh; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #e9ecef; }
        .sidebar-header h2 { color: #333; font-size: 18px; font-weight: 600; }
        .sidebar-nav { padding: 16px 0; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { padding: 0 20px 8px; font-size: 11px; text-transform: uppercase; color: #999; font-weight: 600; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; padding: 12px 20px; color: #555; text-decoration: none; font-size: 14px; transition: background 0.2s, color 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: #f8f9fa; color: #667eea; }
        .nav-item.active { background: #f0f2ff; color: #667eea; border-left-color: #667eea; font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; }
        .main-content { flex: 1; margin-left: 240px; padding: 32px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-header h1 { font-size: 28px; font-weight: 600; color: #333; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e9ecef; margin-bottom: 24px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 16px; font-weight: 600; color: #333; }
        .card-body { padding: 24px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .form-group small { display: block; margin-top: 6px; color: #999; font-size: 12px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #667eea; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #e9ecef; color: #333; }
        .btn-secondary:hover { background: #dee2e6; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
        .alert { padding: 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
        .alert.error { background: #fdeaea; color: #c62828; border: 1px solid #f5c6cb; display: block; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e9ecef; }
        th { background: #f8f9fa; font-weight: 600; color: #555; font-size: 13px; }
        tr:hover td { background: #f8f9fa; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .badge.success { background: #e8f5e9; color: #4caf50; }
        .badge.warning { background: #fff3e0; color: #ff9800; }
        .badge.danger { background: #fdeaea; color: #e74c3c; }
        .badge.info { background: #e3f2fd; color: #2196f3; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 8px; padding: 16px; border: 1px solid #e9ecef; }
        .stat-card h4 { font-size: 12px; color: #999; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 600; color: #333; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); transition: transform 0.3s; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🍀 家庭网络反代 v3.5.0</h2></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">概览</div><a href="/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>仪表盘</a></div>
                <div class="nav-section"><div class="nav-section-title">证书与安全</div><a href="/ssl" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 12h12M8 12v4"/></svg>SSL 证书</a><a href="/waf" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>WAF 防火墙</a></div>
                <div class="nav-section"><div class="nav-section-title">系统管理</div><a href="/settings" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>系统设置</a></div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-header"><h1>WAF 防火墙 (Coraza)</h1></header>

            <div id="alert" class="alert"></div>

            <!-- 状态统计 -->
            <div class="stats-grid">
                <div class="stat-card"><h4>总请求数</h4><div class="value" id="statTotal">-</div></div>
                <div class="stat-card"><h4>拦截次数</h4><div class="value" id="statBlocked">-</div></div>
                <div class="stat-card"><h4>检测告警</h4><div class="value" id="statAlerts">-</div></div>
                <div class="stat-card"><h4>误报数</h4><div class="value" id="statFalsePos">-</div></div>
            </div>

            <!-- 基本设置 -->
            <div class="card">
                <div class="card-header"><h3>⚙️ 基本设置</h3></div>
                <div class="card-body">
                    <form id="wafForm">
                        <div class="form-grid">
                            <div class="form-group checkbox-group">
                                <input type="checkbox" name="enabled" id="waf_enabled" {{if .cfg.Security.EnableWAF}}checked{{end}}>
                                <label for="waf_enabled">启用 WAF</label>
                            </div>
                            <div class="form-group">
                                <label>运行模式</label>
                                <select name="mode" id="waf_mode" {{if not .cfg.Security.EnableWAF}}disabled{{end}}>
                                    <option value="detection" {{if eq .cfg.Security.WAFMode "detection"}}selected{{end}}>检测模式 (仅记录，不拦截)</option>
                                    <option value="prevention" {{if eq .cfg.Security.WAFMode "prevention"}}selected{{end}}>防护模式 (拦截攻击)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>规则引擎</label>
                                <select name="engine" id="waf_engine">
                                    <option value="coraza">Coraza (推荐)</option>
                                    <option value="modsecurity">ModSecurity (兼容)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>规则集</label>
                                <select name="ruleset" id="waf_ruleset">
                                    <option value="owasp_crs">OWASP Core Rule Set (CRS)</option>
                                    <option value="custom">自定义规则</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>敏感度级别</label>
                                <select name="paranoia" id="waf_paranoia">
                                    <option value="1">Level 1 (低误报，基础防护)</option>
                                    <option value="2" selected>Level 2 (平衡)</option>
                                    <option value="3">Level 3 (高安全，可能误报)</option>
                                    <option value="4">Level 4 (极高安全，大量误报)</option>
                                </select>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary">保存设置</button>
                            <button type="button" class="btn btn-secondary" onclick="reloadWAF()">重载规则</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 规则管理 -->
            <div class="card">
                <div class="card-header">
                    <h3>📋 规则管理</h3>
                    <button class="btn btn-primary" onclick="openRuleModal()">添加自定义规则</button>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table id="rulesTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>类型</th>
                                    <th>动作</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="rulesBody">
                                <tr><td colspan="6" class="empty-state">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 拦截日志 -->
            <div class="card">
                <div class="card-header"><h3>🚫 拦截日志</h3></div>
                <div class="card-body">
                    <div class="table-container">
                        <table id="blockedTable">
                            <thead>
                                <tr>
                                    <th>时间</th>
                                    <th>客户端 IP</th>
                                    <th>请求方法</th>
                                    <th>请求 URI</th>
                                    <th>匹配规则</th>
                                    <th>动作</th>
                                </tr>
                            </thead>
                            <tbody id="blockedBody">
                                <tr><td colspan="6" class="empty-state">暂无拦截记录</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 自定义规则模态框 -->
            <div class="modal" id="ruleModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
                <div class="modal-content" style="background:white;border-radius:12px;padding:24px;width:90%;max-width:700px;max-height:90vh;overflow-y:auto;">
                    <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                        <h3 id="ruleModalTitle">添加自定义规则</h3>
                        <button class="modal-close" onclick="closeRuleModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&times;</button>
                    </div>
                    <form id="ruleForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>规则 ID</label>
                                <input type="number" name="id" id="rule_id" placeholder="1000001 (需唯一)">
                            </div>
                            <div class="form-group">
                                <label>规则名称</label>
                                <input type="text" name="name" id="rule_name" placeholder="自定义规则名称" required>
                            </div>
                            <div class="form-group">
                                <label>规则类型</label>
                                <select name="type" id="rule_type">
                                    <option value="REQUEST_HEADERS">请求头</option>
                                    <option value="REQUEST_BODY">请求体</option>
                                    <option value="REQUEST_URI">请求 URI</option>
                                    <option value="REQUEST_METHOD">请求方法</option>
                                    <option value="QUERY_STRING">查询字符串</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>匹配模式 (正则)</label>
                                <input type="text" name="pattern" id="rule_pattern" placeholder=".*sql.*inject.*" required>
                            </div>
                            <div class="form-group">
                                <label>动作</label>
                                <select name="action" id="rule_action">
                                    <option value="deny">拦截</option>
                                    <option value="log">仅记录</option>
                                    <option value="redirect">重定向</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>严重级别</label>
                                <select name="severity" id="rule_severity">
                                    <option value="CRITICAL">Critical</option>
                                    <option value="ERROR">Error</option>
                                    <option value="WARNING">Warning</option>
                                    <option value="NOTICE">Notice</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>描述</label>
                                <textarea name="description" id="rule_description" rows="2" placeholder="规则描述..."></textarea>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary">保存规则</button>
                            <button type="button" class="btn btn-secondary" onclick="closeRuleModal()">取消</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert ' + type;
        }

        // WAF 表单
        document.getElementById('wafForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(this));
            data.enabled = document.getElementById('waf_enabled').checked;
            try {
                const res = await fetch('/api/waf/config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
                const result = await res.json();
                showAlert(result.message || '保存成功', 'success');
                document.getElementById('waf_mode').disabled = !data.enabled;
            } catch (err) { showAlert('保存失败: ' + err.message, 'error'); }
        });

        document.getElementById('waf_enabled').addEventListener('change', function(e) {
            document.getElementById('waf_mode').disabled = !e.target.checked;
        });

        // 规则模态框
        function openRuleModal(id = null) {
            const modal = document.getElementById('ruleModal');
            const form = document.getElementById('ruleForm');
            form.reset();
            if (id) {
                document.getElementById('ruleModalTitle').textContent = '编辑规则';
            } else {
                document.getElementById('ruleModalTitle').textContent = '添加自定义规则';
            }
            modal.style.display = 'flex';
        }
        function closeRuleModal() {
            document.getElementById('ruleModal').style.display = 'none';
        }

        document.getElementById('ruleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            showAlert('规则保存功能开发中', 'success');
            closeRuleModal();
        });

        // 加载数据
        async function loadWAFStats() {
            // 实际需要后端 API
            document.getElementById('statTotal').textContent = '1,234,567';
            document.getElementById('statBlocked').textContent = '1,234';
            document.getElementById('statAlerts').textContent = '567';
            document.getElementById('statFalsePos').textContent = '23';
        }

        async function loadRules() {
            const tbody = document.getElementById('rulesBody');
            tbody.innerHTML = `
                <tr><td>1000001</td><td>SQL注入防护</td><td>REQUEST_BODY</td><td>拦截</td><td><span class="badge success">启用</span></td><td><button class="btn btn-sm btn-secondary" onclick="openRuleModal(1000001)">编辑</button></tr>
                <tr><td>1000002</td><td>XSS攻击防护</td><td>REQUEST_URI</td><td>拦截</td><td><span class="badge success">启用</span></td><td><button class="btn btn-sm btn-secondary" onclick="openRuleModal(1000002)">编辑</button></tr>
                <tr><td>1000003</td><td>路径遍历防护</td><td>REQUEST_URI</td><td>记录</td><td><span class="badge warning">仅记录</span></td><td><button class="btn btn-sm btn-secondary" onclick="openRuleModal(1000003)">编辑</button></tr>
            `;
        }

        async function loadBlockedLogs() {
            const tbody = document.getElementById('blockedBody');
            tbody.innerHTML = `
                <tr><td>2024-01-15 10:30:45</td><td>192.168.1.100</td><td>POST</td><td>/api/login</td><td>SQL注入规则</td><td><span class="badge danger">拦截</span></td></tr>
                <tr><td>2024-01-15 10:25:12</td><td>203.0.113.45</td><td>GET</td><td>/search?q=<script></td><td>XSS规则</td><td><span class="badge danger">拦截</span></td></tr>
            `;
        }

        function reloadWAF() {
            showAlert('重载规则功能开发中', 'success');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadWAFStats();
            loadRules();
            loadBlockedLogs();
        });

        document.getElementById('ruleModal').addEventListener('click', e => { if(e.target === e.currentTarget) closeRuleModal(); });
    </script>
</body>
</html>
