<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭网络反代 - 系统设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px; background: #fff; border-right: 1px solid #e9ecef;
            height: 100vh; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #e9ecef; }
        .sidebar-header h2 { color: #333; font-size: 18px; font-weight: 600; }
        .sidebar-nav { padding: 16px 0; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { padding: 0 20px 8px; font-size: 11px; text-transform: uppercase; color: #999; font-weight: 600; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; padding: 12px 20px; color: #555; text-decoration: none; font-size: 14px; transition: background 0.2s, color 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: #f8f9fa; color: #667eea; }
        .nav-item.active { background: #f0f2ff; color: #667eea; border-left-color: #667eea; font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; }
        .main-content { flex: 1; margin-left: 240px; padding: 32px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-header h1 { font-size: 28px; font-weight: 600; color: #333; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e9ecef; margin-bottom: 24px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #e9ecef; }
        .card-header h3 { font-size: 16px; font-weight: 600; color: #333; }
        .card-body { padding: 24px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .form-group small { display: block; margin-top: 6px; color: #999; font-size: 12px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #667eea; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #e9ecef; color: #333; }
        .btn-secondary:hover { background: #dee2e6; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .alert { padding: 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
        .alert.error { background: #fdeaea; color: #c62828; border: 1px solid #f5c6cb; display: block; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); transition: transform 0.3s; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🍀 家庭网络反代 v3.5.0</h2></div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">概览</div>
                    <a href="/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>仪表盘</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">网络服务</div>
                    <a href="/ddns" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>动态域名 (DDNS)</a>
                    <a href="/reverse-proxy" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>反向代理</a>
                    <a href="/socket-proxy" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/><path d="M12 6v6l4 2"/></svg>端口转发</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">系统管理</div>
                    <a href="/settings" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>系统设置</a>
                    <a href="/modules" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>模块管理</a>
                    <a href="/system" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>系统信息</a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-header"><h1>系统设置</h1></header>

            <div id="alert" class="alert"></div>

            <!-- 登录设置 -->
            <div class="card">
                <div class="card-header"><h3>🔐 登录与安全设置</h3></div>
                <div class="card-body">
                    <form id="settingsForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>用户名</label>
                                <input type="text" name="username" value="{{.cfg.Web.Username}}" required>
                            </div>
                            <div class="form-group">
                                <label>新密码 (留空不修改)</label>
                                <input type="password" name="password" placeholder="输入新密码">
                                <small>修改密码后需要重新登录</small>
                            </div>
                            <div class="form-group">
                                <label>安全入口</label>
                                <input type="text" name="safe_url" value="{{.cfg.Web.SafeURL}}" placeholder="例如: admin123">
                                <small>设置后访问地址变为: http://IP:端口/安全入口/</small>
                            </div>
                            <div class="form-group">
                                <label>Web 管理端口</label>
                                <input type="number" name="port" value="{{.cfg.Web.Port}}" min="1" max="65535" required>
                                <small>修改后需重启生效，范围 1-65535</small>
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="form-group checkbox-group">
                                <input type="checkbox" name="enable_https" id="enable_https" {{if .cfg.Web.EnableHTTPS}}checked{{end}}>
                                <label for="enable_https">启用 HTTPS</label>
                            </div>
                            <div class="form-group checkbox-group">
                                <input type="checkbox" name="disable_2fa" id="disable_2fa" {{if .cfg.Web.Disable2FA}}checked{{end}}>
                                <label for="disable_2fa">禁用 2FA 双因子认证</label>
                            </div>
                        </div>

                        <div class="form-grid" id="httpsFields" style="display: {{if .cfg.Web.EnableHTTPS}}grid{{else}}none{{end}};">
                            <div class="form-group">
                                <label>SSL 证书文件路径</label>
                                <input type="text" name="cert_file" value="{{.cfg.Web.CertFile}}" placeholder="/app/conf/cert.pem">
                            </div>
                            <div class="form-group">
                                <label>SSL 私钥文件路径</label>
                                <input type="text" name="key_file" value="{{.cfg.Web.KeyFile}}" placeholder="/app/conf/key.pem">
                            </div>
                        </div>

                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary">保存设置</button>
                            <button type="button" class="btn btn-danger" onclick="resetCredentials()">重置为默认 (666/666)</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 安全设置 -->
            <div class="card">
                <div class="card-header"><h3>🛡️ 访问控制</h3></div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>IP 白名单 (每行一个，支持 CIDR)</label>
                            <textarea name="ip_whitelist" rows="4" style="width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:8px;font-family:monospace;font-size:13px;">{{range .cfg.Security.IPWhitelist}}{{.}}
{{end}}</textarea>
                            <small>仅允许这些 IP 访问管理界面，为空则不限制</small>
                        </div>
                        <div class="form-group">
                            <label>IP 黑名单 (每行一个，支持 CIDR)</label>
                            <textarea name="ip_blacklist" rows="4" style="width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:8px;font-family:monospace;font-size:13px;">{{range .cfg.Security.IPBlacklist}}{{.}}
{{end}}</textarea>
                            <small>禁止这些 IP 访问管理界面</small>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group checkbox-group">
                            <input type="checkbox" name="enable_waf" id="enable_waf" {{if .cfg.Security.EnableWAF}}checked{{end}}>
                            <label for="enable_waf">启用 WAF 防火墙</label>
                        </div>
                        <div class="form-group">
                            <label>WAF 模式</label>
                            <select name="waf_mode" id="waf_mode" {{if not .cfg.Security.EnableWAF}}disabled{{end}}>
                                <option value="detection" {{if eq .cfg.Security.WAFMode "detection"}}selected{{end}}>检测模式 (仅记录)</option>
                                <option value="prevention" {{if eq .cfg.Security.WAFMode "prevention"}}selected{{end}}>防护模式 (拦截攻击)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 配置管理 -->
            <div class="card">
                <div class="card-header"><h3>💾 配置备份与恢复</h3></div>
                <div class="card-body">
                    <div class="btn-group">
                        <button type="button" class="btn btn-primary" onclick="backupConfig()">备份配置</button>
                        <button type="button" class="btn btn-secondary" onclick="restoreConfig()">恢复配置</button>
                    </div>
                    <small style="display:block;margin-top:12px;color:#999;">配置文件位置: {{.cfg.Storage.Path}}/hnproxy.conf</small>
                </div>
            </div>
        </main>
    </div>

    <script>
        // HTTPS 字段显示/隐藏
        document.getElementById('enable_https').addEventListener('change', function(e) {
            document.getElementById('httpsFields').style.display = e.target.checked ? 'grid' : 'none';
        });

        document.getElementById('enable_waf').addEventListener('change', function(e) {
            document.getElementById('waf_mode').disabled = !e.target.checked;
        });

        // 表单提交
        document.getElementById('settingsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // 处理复选框
            data.enable_https = document.getElementById('enable_https').checked;
            data.disable_2fa = document.getElementById('disable_2fa').checked;
            
            // 处理多行文本
            data.ip_whitelist = document.querySelector('[name="ip_whitelist"]').value.split('\n').filter(s => s.trim());
            data.ip_blacklist = document.querySelector('[name="ip_blacklist"]').value.split('\n').filter(s => s.trim());

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                showAlert(result.message || '保存成功', 'success');
                if (data.port || data.safe_url) {
                    setTimeout(() => location.reload(), 1500);
                }
            } catch (err) {
                showAlert('保存失败: ' + err.message, 'error');
            }
        });

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert ' + type;
        }

        function resetCredentials() {
            if (confirm('确定要重置用户名和密码为默认值 (666/666) 吗？')) {
                fetch('/api/system/reset-credentials', {method: 'POST'})
                    .then(res => res.json())
                    .then(data => {
                        showAlert(data.message, 'success');
                        setTimeout(() => location.reload(), 1500);
                    })
                    .catch(err => showAlert('重置失败: ' + err.message, 'error'));
            }
        }

        function backupConfig() {
            fetch('/api/system/backup', {method: 'POST'})
                .then(res => res.json())
                .then(data => showAlert('备份成功: ' + data.path, 'success'))
                .catch(err => showAlert('备份失败: ' + err.message, 'error'));
        }

        function restoreConfig() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.zip,.conf';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const formData = new FormData();
                formData.append('backup', file);
                try {
                    const res = await fetch('/api/system/restore', {method: 'POST', body: formData});
                    const data = await res.json();
                    showAlert('恢复成功，正在重启...', 'success');
                    setTimeout(() => location.reload(), 2000);
                } catch (err) {
                    showAlert('恢复失败: ' + err.message, 'error');
                }
            };
            input.click();
        }
    </script>
</body>
</html>
