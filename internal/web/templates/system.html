<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭网络反代 - 系统信息</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #fff; border-right: 1px solid #e9ecef; height: 100vh; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #e9ecef; }
        .sidebar-header h2 { color: #333; font-size: 18px; font-weight: 600; }
        .sidebar-nav { padding: 16px 0; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { padding: 0 20px 8px; font-size: 11px; text-transform: uppercase; color: #999; font-weight: 600; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; padding: 12px 20px; color: #555; text-decoration: none; font-size: 14px; transition: background 0.2s, color 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: #f8f9fa; color: #667eea; }
        .nav-item.active { background: #f0f2ff; color: #667eea; border-left-color: #667eea; font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; }
        .main-content { flex: 1; margin-left: 240px; padding: 32px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-header h1 { font-size: 28px; font-weight: 600; color: #333; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e9ecef; margin-bottom: 24px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #e9ecef; }
        .card-header h3 { font-size: 16px; font-weight: 600; color: #333; }
        .card-body { padding: 24px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-value { font-size: 16px; color: #333; font-weight: 500; word-break: break-all; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #e9ecef; color: #333; }
        .btn-secondary:hover { background: #dee2e6; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
        .alert { padding: 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
        .alert.error { background: #fdeaea; color: #c62828; border: 1px solid #f5c6cb; display: block; }
        .progress { height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-bar { height: 100%; background: #667eea; border-radius: 4px; transition: width 0.3s; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); transition: transform 0.3s; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🍀 家庭网络反代 v3.5.0</h2></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">概览</div><a href="/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>仪表盘</a></div>
                <div class="nav-section"><div class="nav-section-title">系统管理</div><a href="/settings" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>系统设置</a><a href="/system" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>系统信息</a></div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-header"><h1>系统信息</h1></header>

            <div id="alert" class="alert"></div>

            <!-- 系统基本信息 -->
            <div class="card">
                <div class="card-header"><h3>📊 系统基本信息</h3></div>
                <div class="card-body">
                    <div class="info-grid" id="systemInfo">
                        <div class="info-item"><span class="info-label">版本</span><span class="info-value" id="sysVersion">-</span></div>
                        <div class="info-item"><span class="info-label">主机名</span><span class="info-value" id="sysHostname">-</span></div>
                        <div class="info-item"><span class="info-label">Go 版本</span><span class="info-value" id="sysGoVersion">-</span></div>
                        <div class="info-item"><span class="info-label">构建时间</span><span class="info-value" id="sysBuildTime">-</span></div>
                        <div class="info-item"><span class="info-label">运行时长</span><span class="info-value" id="sysUptime">-</span></div>
                        <div class="info-item"><span class="info-label">配置目录</span><span class="info-value" id="sysConfigDir">-</span></div>
                    </div>
                </div>
            </div>

            <!-- 资源使用 -->
            <div class="card">
                <div class="card-header"><h3>💾 资源使用情况</h3></div>
                <div class="card-body">
                    <div class="info-grid" id="resourceInfo">
                        <div class="info-item"><span class="info-label">CPU 使用率</span><span class="info-value" id="cpuUsage">-</span><div class="progress"><div class="progress-bar" id="cpuBar" style="width:0%"></div></div></div>
                        <div class="info-item"><span class="info-label">内存使用</span><span class="info-value" id="memUsage">-</span><div class="progress"><div class="progress-bar" id="memBar" style="width:0%"></div></div></div>
                        <div class="info-item"><span class="info-label">磁盘使用</span><span class="info-value" id="diskUsage">-</span><div class="progress"><div class="progress-bar" id="diskBar" style="width:0%"></div></div></div>
                        <div class="info-item"><span class="info-label">Goroutines</span><span class="info-value" id="goRoutines">-</span></div>
                    </div>
                </div>
            </div>

            <!-- 网络信息 -->
            <div class="card">
                <div class="card-header"><h3>🌐 网络信息</h3></div>
                <div class="card-body">
                    <div class="info-grid" id="networkInfo">
                        <div class="info-item"><span class="info-label">本地 IPv4</span><span class="info-value" id="localIPv4">-</span></div>
                        <div class="info-item"><span class="info-label">本地 IPv6</span><span class="info-value" id="localIPv6">-</span></div>
                        <div class="info-item"><span class="info-label">公网 IPv4</span><span class="info-value" id="publicIPv4">-</span></div>
                        <div class="info-item"><span class="info-label">公网 IPv6</span><span class="info-value" id="publicIPv6">-</span></div>
                    </div>
                </div>
            </div>

            <!-- 操作 -->
            <div class="card">
                <div class="card-header"><h3>🔧 系统操作</h3></div>
                <div class="card-body">
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="restart家庭网络反代()">重启 家庭网络反代</button>
                        <button class="btn btn-secondary" onclick="backupConfig()">备份配置</button>
                        <button class="btn btn-secondary" onclick="restoreConfig()">恢复配置</button>
                        <button class="btn btn-danger" onclick="resetCredentials()">重置凭据 (666/666)</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert ' + type;
        }

        // 加载系统信息
        async function loadSystemInfo() {
            try {
                const res = await fetch('/api/system/info');
                const data = await res.json();
                document.getElementById('sysVersion').textContent = data.version;
                document.getElementById('sysHostname').textContent = data.hostname;
                document.getElementById('sysGoVersion').textContent = data.goVersion;
                document.getElementById('sysBuildTime').textContent = data.buildTime;
                document.getElementById('sysUptime').textContent = data.uptime;
                document.getElementById('sysConfigDir').textContent = data.configDir;
            } catch (err) {
                console.error('加载系统信息失败:', err);
            }
        }

        // 加载资源使用 (模拟)
        function loadResourceInfo() {
            // 实际需要后端 API 支持
            document.getElementById('cpuUsage').textContent = '获取中...';
            document.getElementById('memUsage').textContent = '获取中...';
            document.getElementById('diskUsage').textContent = '获取中...';
            document.getElementById('goRoutines').textContent = '获取中...';
        }

        // 加载网络信息
        async function loadNetworkInfo() {
            try {
                // 尝试获取公网 IP
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                document.getElementById('publicIPv4').textContent = data.ip;
            } catch {
                document.getElementById('publicIPv4').textContent = '获取失败';
            }
        }

        // 重启 家庭网络反代
        async function restart家庭网络反代() {
            if (!confirm('确定要重启 家庭网络反代 吗？')) return;
            try {
                const res = await fetch('/api/system/restart', {method: 'POST'});
                const data = await res.json();
                showAlert(data.message, 'success');
            } catch (err) {
                showAlert('重启失败: ' + err.message, 'error');
            }
        }

        // 备份配置
        async function backupConfig() {
            try {
                const res = await fetch('/api/system/backup', {method: 'POST'});
                const data = await res.json();
                showAlert('备份成功: ' + data.path, 'success');
            } catch (err) {
                showAlert('备份失败: ' + err.message, 'error');
            }
        }

        // 恢复配置
        function restoreConfig() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.zip,.conf';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const formData = new FormData();
                formData.append('backup', file);
                try {
                    const res = await fetch('/api/system/restore', {method: 'POST', body: formData});
                    const data = await res.json();
                    showAlert('恢复成功，正在重启...', 'success');
                    setTimeout(() => location.reload(), 2000);
                } catch (err) {
                    showAlert('恢复失败: ' + err.message, 'error');
                }
            };
            input.click();
        }

        // 重置凭据
        async function resetCredentials() {
            if (!confirm('确定要重置用户名和密码为默认值 (666/666) 吗？')) return;
            try {
                const res = await fetch('/api/system/reset-credentials', {method: 'POST'});
                const data = await res.json();
                showAlert(data.message, 'success');
                setTimeout(() => location.reload(), 1500);
            } catch (err) {
                showAlert('重置失败: ' + err.message, 'error');
            }
        }

        // 定时刷新
        document.addEventListener('DOMContentLoaded', () => {
            loadSystemInfo();
            loadResourceInfo();
            loadNetworkInfo();
            setInterval(loadResourceInfo, 10000);
        });
    </script>
</body>
</html>
